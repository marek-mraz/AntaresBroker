[workspace]
resolver = "2"
members = [
    "crates/antares-model",
    "crates/antares-jsonld",
    "crates/antares-ql",
    "crates/antares-sql",
    "crates/antares-bus",
    "crates/antares-api",
    "crates/antares-matcher",
    "crates/antares-notifier",
    "crates/antares-temporal",
    "crates/antares-registry",
    "crates/antares-broker",
]
# §16.2 fuzz harness: own lockfile/profile, built only by cargo-fuzz on
# nightly (.github/workflows/fuzz.yml) — never part of the normal build.
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"
repository = "https://github.com/AntaresBroker/AntaresBroker"

[workspace.dependencies]
antares-model = { path = "crates/antares-model" }
antares-jsonld = { path = "crates/antares-jsonld" }
antares-ql = { path = "crates/antares-ql" }
antares-sql = { path = "crates/antares-sql" }
antares-bus = { path = "crates/antares-bus" }
antares-api = { path = "crates/antares-api" }
antares-matcher = { path = "crates/antares-matcher" }
antares-notifier = { path = "crates/antares-notifier", default-features = false }
antares-temporal = { path = "crates/antares-temporal" }
antares-registry = { path = "crates/antares-registry" }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
regex = "1"
axum = "0.8"
hyper = "1"
hyper-util = { version = "0.1", features = ["server-auto", "http1", "http2", "tokio"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["normalize-path"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
redb = "4.1"
rumqttc = { version = "0.24", default-features = false, features = ["use-rustls"] }
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "json", "chrono", "uuid", "migrate", "macros"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# dev
http-body-util = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
