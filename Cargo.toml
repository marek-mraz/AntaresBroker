[workspace]
resolver = "2"
members = [
    "crates/antares-model",
    "crates/antares-jsonld",
    "crates/antares-ql",
    "crates/antares-sql",
    "crates/antares-bus",
    "crates/antares-api",
    "crates/antares-matcher",
    "crates/antares-notifier",
    "crates/antares-registry",
    "crates/antares-broker",
    "crates/antares-wasm",
]
# §16.2 fuzz harness: own lockfile/profile, built only by cargo-fuzz on
# nightly (.github/workflows/fuzz.yml) — never part of the normal build.
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"
repository = "https://github.com/AntaresBroker/AntaresBroker"

[workspace.dependencies]
antares-model = { path = "crates/antares-model" }
antares-jsonld = { path = "crates/antares-jsonld" }
antares-ql = { path = "crates/antares-ql" }
antares-sql = { path = "crates/antares-sql", default-features = false }
antares-bus = { path = "crates/antares-bus" }
antares-api = { path = "crates/antares-api", default-features = false }
antares-matcher = { path = "crates/antares-matcher" }
antares-notifier = { path = "crates/antares-notifier", default-features = false }
antares-registry = { path = "crates/antares-registry" }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "v5"] }
regex = "1"
axum = "0.8"
hyper = "1"
hyper-util = { version = "0.1", features = ["server-auto", "http1", "http2", "tokio"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["normalize-path"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
redb = "4.1"
rumqttc = { version = "0.24", default-features = false, features = ["use-rustls"] }
# H7 geoquery evaluator (4.10): DE-9IM relate + GeoJSON conversion
geo = "0.33"
geo-types = "0.7"
geojson = "0.24"
# J2 @context parsed-LRU / J6 sonic ingest fast path / J7 allocator
moka = { version = "0.12", features = ["sync"] }
sonic-rs = "0.5"
tikv-jemallocator = "0.7"
tikv-jemalloc-ctl = { version = "0.7", features = ["stats"] }
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "json", "chrono", "uuid", "migrate", "macros"] }
# F1 (§6.4): the JetStream change spine — official client, KV + streams in core
# (0.50 verified on crates.io 2026-08-03, §6.1; pre-1.0 pin — upgrade in dedicated PRs)
async-nats = "0.50"
futures-util = { version = "0.3", default-features = false }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }
# K12 observability: antares_ Prometheus metrics (§9.1), env-gated OTLP traces
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
opentelemetry = "0.32"
opentelemetry_sdk = "0.32"
opentelemetry-otlp = { version = "0.32", default-features = false, features = [
    "trace",
    "http-proto",
    "reqwest-blocking-client",
] }
tracing-opentelemetry = "0.33"
console-subscriber = "0.5"

# dev
http-body-util = "0.1"

# N: browser build (antares-wasm + the wasm32 target sections of core crates)
http = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = "0.3"
console_error_panic_hook = "0.1"
# std::time re-export natively; performance.now()-backed on wasm32 —
# std::time::Instant::now() PANICS on wasm32-unknown-unknown (N2 clock rule).
web-time = "1"
gloo-timers = { version = "0.3", features = ["futures"] }
# Sound single-thread Send/Sync bridge (runtime-checked) — reqwest's wasm
# client/futures are !Send but axum demands Send everywhere.
send_wrapper = { version = "0.6", features = ["futures"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
