[package]
name = "antares-broker"
description = "The Antares NGSI-LD context broker binary."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "antares"
path = "src/main.rs"

[dependencies]
antares-api = { workspace = true }
axum = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
antares-bus = { workspace = true }
antares-model = { workspace = true }
antares-sql = { workspace = true }
antares-temporal = { workspace = true }
futures-util = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
serde_json = { workspace = true }
# J7: decay-purging allocator + heap stats (§6.1; glibc malloc is the one
# wrong answer). Unix-only: the wasm target (§N) keeps the default.
[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = { workspace = true }
tikv-jemalloc-ctl = { workspace = true }

[dev-dependencies]
# mqtt e2e (G1/G4 local proof): sync rumqttc client against a live mosquitto
rumqttc = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
