[package]
name = "antares-broker"
description = "The Antares NGSI-LD context broker binary."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "antares"
path = "src/main.rs"

[dependencies]
# N2: the workspace dep is default-features=false so the wasm crate can shed
# the Pg arm; the native binary turns everything back on here.
antares-api = { workspace = true, features = ["mqtt", "postgres"] }
axum = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
antares-bus = { workspace = true }
antares-model = { workspace = true }
antares-sql = { workspace = true, features = ["postgres"] }
futures-util = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
serde_json = { workspace = true }
# K12: Prometheus render at /q/metrics + env-gated OTLP span export. Only the
# composition root knows the exporters exist (§9.2) — core crates speak the
# `metrics` facade at most (a no-op without an installed recorder). The
# whole stack is a RUNTIME switch: ANTARES_TELEMETRY=1 installs it, the
# default allocates none of it (§2.1 lean posture).
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-otlp = { workspace = true }
tracing-opentelemetry = { workspace = true }
console-subscriber = { workspace = true, optional = true }

[features]
# K12: tokio-console in dev — build with RUSTFLAGS="--cfg tokio_unstable"
# and run `tokio-console` against the default port. Never on in release
# images. The layer only arms under cfg(tokio_unstable), so an
# --all-features build without the RUSTFLAGS stays a no-op instead of
# panicking at startup.
console = ["dep:console-subscriber"]
# J7: decay-purging allocator + heap stats (§6.1; glibc malloc is the one
# wrong answer). Unix-only: the wasm target (§N) keeps the default.
[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = { workspace = true }
tikv-jemalloc-ctl = { workspace = true }

[dev-dependencies]
# mqtt e2e (G1/G4 local proof): sync rumqttc client against a live mosquitto
rumqttc = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
