[package]
name = "antares-notifier"
description = "Notification delivery: NotificationSink trait keyed by endpoint.uri scheme; http sink; mqtt behind feature."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
antares-model = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
rumqttc = { workspace = true, optional = true }

[features]
default = ["mqtt"]
mqtt = ["dep:rumqttc"]

[lints]
workspace = true

# N2: same crates, target-appropriate backends (sockets + rustls natively,
# the browser's own fetch/timers on wasm32). A dependency TARGET section, not
# a logic change.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "sync", "macros"] }

