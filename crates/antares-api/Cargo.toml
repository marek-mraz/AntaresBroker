[package]
name = "antares-api"
description = "NGSI-LD HTTP binding (TS 104 176 shape): axum routers. Thin handlers; no business logic."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
antares-model = { workspace = true }
antares-jsonld = { workspace = true }
antares-ql = { workspace = true }
antares-sql = { workspace = true }
antares-notifier = { workspace = true, default-features = false }
geo = { workspace = true }
geo-types = { workspace = true }
geojson = { workspace = true }
sonic-rs = { workspace = true, optional = true }
axum = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
regex = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }

[features]
# Clause 7 MQTT notification binding (G1); on by default — the 058 TPs need it.
default = ["mqtt"]
mqtt = ["antares-notifier/mqtt"]
# J6: sonic-rs on the batch-ingest hot path (x86_64/aarch64); serde_json is
# always the compiled fallback (§6.1).
sonic = ["dep:sonic-rs"]

[dev-dependencies]
tower = { workspace = true, features = ["util"] }
http-body-util = { workspace = true }

[lints]
workspace = true
