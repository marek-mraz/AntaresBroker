# HSL HFP → Antares demo (2026-08-12): live vehicle positions from
# mqtt.hsl.fi ingested as NGSI-LD entities with a 3-minute expiresAt,
# broker on timescale with a 10 s expiry flush (ANTARES_SWEEP_SECS).
# Broker published on host port 42010 (Mac: http://localhost:42010).
services:
  timescale:
    image: timescale/timescaledb-ha:pg17
    environment:
      POSTGRES_USER: antares
      POSTGRES_PASSWORD: antares
      POSTGRES_DB: antares
      NO_TS_TUNE: "true"   # tune panics without a memory cgroup (this sandbox)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U antares"]
      interval: 5s
      timeout: 3s
      retries: 20
    # no memory limits: this sandbox's cgroup tree delegates only
    # cpuset/cpu/pids (threaded-mode), so the memory controller is absent

  antares:
    image: debian:12-slim
    command: ["/antares"]
    volumes:
      - ../../target/release/antares:/antares:ro
    environment:
      ANTARES_HTTP_PORT: "9090"
      ANTARES_STORE: timescale
      ANTARES_DATABASE_URL: postgres://antares:antares@timescale:5432/antares
      ANTARES_SWEEP_SECS: "10"        # 4.22 GC flush every 10 s
      ANTARES_TELEMETRY: "1"          # /q/metrics Prometheus render
      ANTARES_EGRESS_ALLOW_PRIVATE: "true"   # allow notification delivery to in-network listeners
      ANTARES_MAX_BATCH_ITEMS: "5000"        # full-fleet 1s flush in one batch (default 1000)
      RUST_LOG: info
    ports:
      - "42010:9090"
    depends_on:
      timescale:
        condition: service_healthy

  ingester:
    build: ./ingester
    environment:
      BROKER: http://antares:9090/ngsi-ld/v1
      MQTT_HOST: mqtt.hsl.fi
      MQTT_TOPIC: /hfp/v2/journey/ongoing/vp/#
      TTL_SECS: "180"                 # entity expiresAt = now + 3 min
      ATTR_TTL_SECS: "600"            # attribute expiresAt = now + 10 min (rolling history window)
      FLUSH_MS: "1000"
      BATCH_LIMIT: "5000"             # matches ANTARES_MAX_BATCH_ITEMS
    depends_on:
      - antares
