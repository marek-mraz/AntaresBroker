  # and ordering); the mnemonic index reports the collision.
  - id: A.5.2.31
    title: Retrieve, Update and Delete Entity Maps
    rows:
      - {item: 1, feature: "/entityMaps/{entityMapId}", subfeature: GET, clauses: ["5.14.1", "6.32.3.1"], mnemonic: EntRet}
