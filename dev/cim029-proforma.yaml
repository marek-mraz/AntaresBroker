      - {item: 2, feature: Only return createdAt / modifiedAt if asked by consumers, clauses: ["5.2.2"], mnemonic: SYSPROPS_IFASKED}
      - {item: 3, feature: Use of the common error types, clauses: ["5.5.2"], mnemonic: COMMONERRTYPES}
