      - {item: 2, feature: "/jsonldContexts/{contextId}", subfeature: DELETE, clauses: ["5.13.5", "6.30.3.2"], mnemonic: DelOneSpe@coInt}

  - id: A.5.2.30
    title: Create EntityMap for Query Entities
    rows:
      - {item: 1, feature: /entityMaps/, subfeature: GET, clauses: ["5.14.4"], mnemonic: QueEntForCreEnt}
      - {item: 2, feature: /entityMaps/, subfeature: POST, clauses: ["5.14.4"], mnemonic: QueEntForCreEnt}

