# ETSI GS CIM 029 V2.1.1 (2025-07), Annex A (normative): ICS Pro forma.
#
# Annex A.0 grants the right to reproduce this pro forma and to publish the
# completed form. Clause 4 requires a conforming pro forma to be technically
# equivalent to Annex A and to PRESERVE THE NUMBERING AND ORDERING of its
# items, so table ids, item numbers and row order below are verbatim and must
# not be re-sorted or renumbered.
#
# The `clauses` of each row cite ETSI GS CIM 009. CIM 029 V2.1.1 references
# CIM 009 V1.6.1 while the ledger in docs/spec/ carries V1.9.1, so a cited
# clause can be renumbered or absent; `spec.py ics` reports such rows rather
# than scoring them.

# Supplier declaration (A.2, A.4). Answering A.4 is the supplier's statement,
# not a derived value: many A.5.1 features are optional by architecture.
identification:
  iut_name: Antares
  # iut_version is read from Cargo.toml at render time.
  sut_hardware: ""
  sut_operating_system: ""
  supplier_name: ""
  supplier_address: ""
  supplier_email: ""
  contact_name: ""
  contact_email: ""
# Yes | No | unset. Left unset until a supplier signs the claim.
global_statement_of_conformance: unset

tables:
  # ---- A.5.1 Features ----
  - id: A.5.1.1
    title: Architecture
    rows:
      - {item: 1, feature: Centralized architecture, clauses: ["4.3.2"], mnemonic: CENTRALIZED}
      - {item: 2, feature: Distributed architecture, clauses: ["4.3.3"], mnemonic: DISTRIBUTED}
      - {item: 3, feature: Federated architecture, clauses: ["4.3.4"], mnemonic: FEDERATED}
      - {item: 4, feature: Inclusive context source registrations, clauses: ["4.3.6.2"], mnemonic: INCLUSIVECSR}
      - {item: 5, feature: Auxiliary context source registrations, clauses: ["4.3.6.2"], mnemonic: AUXILIARYCSR}
      - {item: 6, feature: Exclusive context source registrations, clauses: ["4.3.6.3"], mnemonic: EXCLUSIVECSR}
      - {item: 7, feature: Redirect context source registrations, clauses: ["4.3.6.3"], mnemonic: REDIRECTCSR}
      - {item: 8, feature: Limit to local requests, clauses: ["4.3.6.4"], mnemonic: LOCAL}
      - {item: 9, feature: Extra information to provide when contacting Context Source, clauses: ["4.3.6.5"], mnemonic: EXTRACS}
      - {item: 10, feature: Additional pre- and post-processing of extra information when contacting Context Source, clauses: ["4.3.6.6"], mnemonic: PROCESSCS}
      - {item: 11, feature: Querying with entityMap for consistent entity set, clauses: ["4.3.6.7"], mnemonic: ENTITYMAP_QUERY}

  - id: A.5.1.2
    title: Core NGSI-LD @context
    rows:
      - {item: 1, feature: Core and user NGSI-LD @context, clauses: ["4.4"], mnemonic: USERCONTEXT}

