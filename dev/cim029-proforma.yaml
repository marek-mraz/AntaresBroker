  # CIM 029 V2.1.1 cites 5.15.4 for this resource. Under CIM 009 V1.9.1 that
  # number does not exist (5.15 is Context Source Identity Information, whose
  # only sub-clause is 5.15.1); the clause carrying this table's own title,
  # "Create EntityMap for Query Temporal Evolution of Entities", is 5.14.5,
  # with the HTTP binding at 6.35.3.1 (GET) and 6.35.3.2 (POST). The published
  # citation stays in `clauses` so the rendered column matches Annex A;
  # `clauses_v191` is what the ledger is scored against.
  - id: A.5.2.26
    title: Create EntityMap for Query Temporal Evolution of Entities
    rows:
      - {item: 1, feature: /temporal/entityMaps/, subfeature: GET, clauses: ["5.15.4"], clauses_v191: ["5.14.5", "6.35.3.1"], mnemonic: QueTemEvoEntFor}
      - {item: 2, feature: /temporal/entityMaps/, subfeature: POST, clauses: ["5.15.4"], clauses_v191: ["5.14.5", "6.35.3.2"], mnemonic: QueTemEvoEntFor}

  - id: A.5.2.27
    title: Temporal Query Operation
    rows:
      - {item: 1, feature: /temporal/entityOperations/query, subfeature: POST, clauses: ["5.7.4", "6.24.3.1"], mnemonic: QueTemEvoEntPos}

