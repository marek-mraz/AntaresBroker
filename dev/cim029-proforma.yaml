      - {item: 4, feature: Entity - Relationships, clauses: ["4.5.1"], mnemonic: E_RELS}
      - {item: 5, feature: Entity - location, clauses: ["4.7.1"], mnemonic: E_LOCATION}
      - {item: 6, feature: Entity - operationSpace, clauses: ["4.7.1"], mnemonic: E_OPSPACE}
      - {item: 7, feature: Entity - observationSpace, clauses: ["4.7.1"], mnemonic: E_OBSVSPACE}
      - {item: 8, feature: Entity - Simplified representation, clauses: ["4.5.4"], mnemonic: E_SIMPLIFIED}
      - {item: 9, feature: Property - base representation, clauses: ["4.5.2"], mnemonic: P_BASE}
      - {item: 10, feature: Property - createdAt / modifiedAt / deletedAt, clauses: ["4.5.2"], mnemonic: P_SYSPROPS}
      - {item: 11, feature: Property - observedAt, clauses: ["4.5.2"], mnemonic: P_OBSVAT}
      - {item: 12, feature: Property - unitCode, clauses: ["4.5.2"], mnemonic: P_UNITCODE}
      - {item: 13, feature: Property - Properties, clauses: ["4.5.2"], mnemonic: P_PROPS}
      - {item: 14, feature: Property - Relationships, clauses: ["4.5.2"], mnemonic: P_RELS}
      - {item: 15, feature: Property - datasetId, clauses: ["4.5.2", "4.5.5"], mnemonic: P_DATASETID}
      - {item: 16, feature: Property - instanceId, clauses: ["4.5.2"], mnemonic: P_INSTANCEID}
      - {item: 17, feature: Property - Temporal representation, clauses: ["4.5.7"], mnemonic: P_TEMPORAL_REP}
      - {item: 18, feature: Property - Simplified temporal representation, clauses: ["4.5.9"], mnemonic: P_SIMPTEMPORAL_REP}
      - {item: 19, feature: Relationship - base representation, clauses: ["4.5.3"], mnemonic: R_BASE}
      - {item: 20, feature: Relationship - createdAt / modifiedAt / deletedAt, clauses: ["4.5.3"], mnemonic: R_SYSPROPS}
      - {item: 21, feature: Relationship - observedAt, clauses: ["4.5.3"], mnemonic: R_OBSVAT}
