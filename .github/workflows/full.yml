name: full

# The EVERYTHING pipeline — twice a week on schedule, on every v* tag, and
# on manual dispatch: workspace tests, the browser/wasm artifact proven in
# both runtimes, the wasm Node tier, and the reusable cell matrix at the
# FULL preset (all seven cells — memory/file/postgres/timescale, both
# rolling -nats fleets, wasm-file — each serial-all-suites against one
# stack; the former etsi-serial job duplicated this, removed 2026-08-16).
#
# etsi-full.yml was folded in HERE 2026-08-23: it duplicated this exact
# workspace→matrix graph on a 3-day cron. The schedule (now 2×/week) and
# the antares-wasm-broker:dev publish live here since; pages.yml listens to
# THIS workflow, so the README badges + /reports/ page always render a full
# 7-cell run (per-commit quick bundles are named ETSI-quick-results and
# never folded).
#
# Publishing: a green v* tag mints the release image (:<version> +
# :latest); schedule/dispatch runs publish only the ETSI-proven wasm dev
# image (the native :dev ships per-commit from ci.yml).
# Moved out 2026-08-17: the roll-under-suite drill lives in roll-weekly.yml
# (weekly + dispatch), the k8s manifest smoke in k8s-smoke.yml (dispatch).

on:
  schedule:
    # Wed + Sat 03:23 UTC — the twice-a-week full proof, offset from
    # strict's daily 02:41, fuzz's Mon+Thu 03:17 and roll-weekly's Tue 04:17.
    - cron: "23 3 * * 3,6"
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: full-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  MEM_LIMIT_MB: 350

jobs:
  workspace:
    # The shared workspace-test gate (workflow_call) — one definition for
    # ci and full, see .github/workflows/workspace.yml.
    name: Workspace tests
    uses: ./.github/workflows/workspace.yml

  wasm:
    # The browser artifact. Build (size budget enforced by the script),
    # then prove it in BOTH runtimes (dev/wasm-test.sh): the
    # Node shim does a create + a real-HTTP notification; headless Chromium
    # runs the React playground — OPFS worker broker, entity, subscription,
    # in-page notification, second tab, federation. Same scripts as local
    # runs (§E).
    name: Browser build (wasm32)
    # GATE: builds start only after the workspace suite is green (the same
    # workspace -> builds -> matrix graph as ci.yml / etsi-full.yml).
    needs: workspace
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: wasm-bindgen (lockfile-matched) + binaryen
        run: |
          ./dev/install-wasm-tools.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build + size budget
        run: |
          ./dev/wasm-build.sh | tee wasm-size.txt
          echo "## Browser artifact" >> "$GITHUB_STEP_SUMMARY"
          tail -1 wasm-size.txt >> "$GITHUB_STEP_SUMMARY"
      - name: React playground — deps, test, build (www)
        working-directory: www
        run: |
          npm ci --no-audit --no-fund
          npx playwright-core install --with-deps chromium
          npx vitest run
          npm run build
      - name: Node tier smoke + browser tier
        run: ./dev/wasm-test.sh
      # NO bundle upload here: the run's ONE antares-wasm-pkg artifact comes
      # from the matrix's build-wasm job — the bytes the wasm-file cell
      # ETSI-tested — and that is what publish-wasm and the release ship.
      # (Uploading a second bundle under the same name would collide: v4+
      # artifacts are immutable.)

  matrix:
    # The reusable cell matrix at the FULL preset (default): all seven cells
    # — memory/file/postgres/timescale, both rolling -nats fleets, wasm-file
    # — each running every suite serially against one stack with the
    # between-suite reset.
    name: ETSI cell matrix
    # GATE: same graph as ci.yml — no image build / ETSI run on a red
    # workspace suite.
    needs: workspace
    uses: ./.github/workflows/etsi-matrix.yml
    permissions:
      contents: read
      actions: write # the summary job deletes the merged per-cell artifacts

  # etsi-serial was REMOVED 2026-08-16: it duplicated the matrix exactly.
  # Its comment claimed the matrix cells got a fresh stack per suite — true
  # in the 32-cell era, stale since the matrix became all-suites-per-cell:
  # every cell now runs the suites IN ORDER against ONE stack with the
  # between-suite reset, which is precisely what serial proved.

  etsi-wasm:
    # The Node tier — the serial ETSI suites against the BROWSER
    # artifact: five node shims serving the same .wasm a page loads
    # (WASM=1 in the one pipeline). MQTT stays excluded (no MQTT sink in a
    # browser build) and there is no RSS gate (the wasm size budget is the
    # artifact's own gate). Cadence: this workflow's — twice a week, tags,
    # manual.
    name: wasm Node tier (serial suites)
    needs: [workspace, wasm]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Fetch the ETSI test suite (submodule)
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule sync
          git submodule update --init --depth 1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: wasm toolchain
        run: |
          ./dev/install-wasm-tools.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Serial suites against the wasm shims
        env:
          WASM: "1"
          STORE: memory
          STOP_ON_ERROR: "0"
          CALLBACK_HOST: localhost
          RESULTS_DIR: results/wasm-node
        run: ./dev/etsi-pipeline.sh || true
      - name: Upload wasm-tier results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ETSI-wasm-node
          path: |
            results/wasm-node/run-summary.md
            results/wasm-node/gate-status.txt
            results/wasm-node/failures.csv
            results/wasm-node/**/log.html
            results/wasm-node/**/report.html
          retention-days: 14
      - name: Gate — the wasm Node tier is green
        run: |
          gate=$(cat results/wasm-node/gate-status.txt 2>/dev/null || echo MISSING)
          echo "wasm Node tier gate = $gate"
          cat results/wasm-node/run-summary.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          [ "$gate" = PASS ]

  build-arm:
    # The arm64 half of the released manifest — BUILT, never tested; the
    # rationale lives in the shared build-image.yml. Tag runs only.
    name: Build the arm64 image (untested)
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/build-image.yml
    with:
      arch: arm64

  publish-wasm:
    # The wasm broker dev image (folded in from etsi-full.yml 2026-08-23):
    # publishes AFTER the wasm-file cell ran the full ETSI suite against
    # these exact bytes and the browser/Node tiers passed — publish follows
    # proof. Schedule + dispatch runs only; a v* tag ships the same bundle
    # as a release asset instead.
    name: Publish the wasm dev image to GHCR
    if: success() && !startsWith(github.ref, 'refs/tags/')
    needs: [matrix, wasm, etsi-wasm]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Download the ETSI-tested wasm bundle (the matrix's build-wasm)
        uses: actions/download-artifact@v7
        with:
          name: antares-wasm-pkg
          path: www/pkg

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push antares-wasm-broker:dev (multi-arch — the .wasm bytes are arch-neutral)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.wasm
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/antares-wasm-broker:dev
            ghcr.io/${{ github.repository_owner }}/antares-wasm-broker:dev-${{ github.run_number }}

  publish-release:
    # A version tag is the only thing that mints a production image, and it
    # needs the full cell matrix green (each cell is serial-all-suites).
    # The roll drill (roll-weekly.yml) and k8s smoke (k8s-smoke.yml) run on
    # their own cadence and no longer gate the release.
    name: Publish the release image to GHCR
    if: startsWith(github.ref, 'refs/tags/v') && success()
    needs: [matrix, build-arm]
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Download the tested image
        uses: actions/download-artifact@v7
        with:
          name: antares-image

      - name: Download the arm64 image
        uses: actions/download-artifact@v7
        with:
          name: antares-image-arm64

      - name: Push amd64 (the EXACT image both gates tested) + arm64, stitch the manifest
        run: |
          docker load < antares-image.tgz
          docker load < antares-image-arm64.tgz
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          IMG=ghcr.io/${{ github.repository_owner }}/antares-broker
          VER="${GITHUB_REF#refs/tags/}"
          SHA=${GITHUB_SHA::7}
          docker tag antares-local:latest "$IMG:$SHA-amd64"
          docker tag antares-local:arm64 "$IMG:$SHA-arm64"
          docker push "$IMG:$SHA-amd64"
          docker push "$IMG:$SHA-arm64"
          docker buildx imagetools create \
            -t "$IMG:$VER" -t "$IMG:$SHA" -t "$IMG:latest" \
            "$IMG:$SHA-amd64" "$IMG:$SHA-arm64"
          echo -e "\n## Released: \`$IMG:$VER\` + \`$IMG:latest\` (multi-arch amd64+arm64; amd64 = the tested bytes, matrix + serial, all four store modes green)" >> "$GITHUB_STEP_SUMMARY"

  release-binaries:
    # Static musl binaries per arch — release assets.
    name: Release binary (${{ matrix.target }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: workspace
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get install -y -q musl-tools
      - name: Build + package
        run: |
          # --locked: the released binary and the released image must be built
          # from the same dependency set (the Dockerfile builds locked too).
          cargo build --locked --release --target ${{ matrix.target }} -p antares-broker
          strip "target/${{ matrix.target }}/release/antares"
          VER="${GITHUB_REF#refs/tags/}"
          tar czf "antares-$VER-${{ matrix.target }}.tar.gz"             -C "target/${{ matrix.target }}/release" antares             -C "$GITHUB_WORKSPACE" LICENSE README.md
      - uses: actions/upload-artifact@v6
        with:
          name: release-bin-${{ matrix.target }}
          path: antares-*.tar.gz

  github-release:
    # The GitHub Release — gated on the SAME green the image needed,
    # with binaries, the wasm bundle, an SBOM, and a signed image.
    name: GitHub Release (assets + SBOM + signature)
    if: startsWith(github.ref, 'refs/tags/v') && success()
    needs: [publish-release, release-binaries, wasm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write # cosign keyless
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          pattern: release-bin-*
          merge-multiple: true
      # the matrix's build-wasm bundle — the ETSI-tested bytes
      - uses: actions/download-artifact@v7
        with:
          name: antares-wasm-pkg
          path: wasm-pkg
      - name: Zip the wasm bundle
        run: |
          VER="${GITHUB_REF#refs/tags/}"
          (cd wasm-pkg && zip -qr "../antares-wasm-$VER.zip" .)
      - name: SBOM (syft, spdx-json) of the released image
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository_owner }}/antares-broker:${{ github.ref_name }}
          format: spdx-json
          output-file: antares-${{ github.ref_name }}.sbom.spdx.json
          upload-artifact: false
      - name: Sign the image (cosign keyless)
        uses: sigstore/cosign-installer@v3
      - run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          cosign sign --yes "ghcr.io/${{ github.repository_owner }}/antares-broker:${{ github.ref_name }}"
      - name: Release notes from CHANGELOG
        run: |
          VER="${GITHUB_REF#refs/tags/}"
          awk -v ver="$VER" '
            /^## / { on = index($0, "[" substr(ver,2) "]") || index($0, "[Unreleased]") }
            on && !/^## / { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${GITHUB_REF#refs/tags/}"
          gh release create "$VER"             --title "Antares $VER" --notes-file notes.md             antares-*.tar.gz "antares-wasm-$VER.zip" "antares-$VER.sbom.spdx.json"
