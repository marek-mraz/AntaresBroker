name: full

# The EVERYTHING pipeline — manual dispatch, or automatically on a v* tag:
# workspace tests, the browser/wasm artifact + wasm Node tier, the reusable
# cell matrix (FULL preset: all seven cells, each already serial-all-suites
# against one stack — the former etsi-serial job duplicated this and was
# removed 2026-08-16), the roll-under-suite drill and the k8s manifest smoke. A
# green v* tag publishes the release image (:<version> + :latest); manual
# dispatches publish nothing.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: full-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  MEM_LIMIT_MB: 350

jobs:
  workspace:
    # The shared workspace-test gate (workflow_call) — one definition for
    # ci/full/etsi-full, see .github/workflows/workspace.yml.
    name: Workspace tests
    uses: ./.github/workflows/workspace.yml

  wasm:
    # The browser artifact. Build (size budget enforced by the script),
    # then prove it in BOTH runtimes (dev/wasm-test.sh): the
    # Node shim does a create + a real-HTTP notification; headless Chromium
    # runs the React playground — OPFS worker broker, entity, subscription,
    # in-page notification, second tab, federation. Same scripts as local
    # runs (§E).
    name: Browser build (wasm32)
    # GATE: builds start only after the workspace suite is green (the same
    # workspace -> builds -> matrix graph as ci.yml / etsi-full.yml).
    needs: workspace
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: wasm-bindgen (lockfile-matched) + binaryen
        run: |
          ./dev/install-wasm-tools.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build + size budget
        run: |
          ./dev/wasm-build.sh | tee wasm-size.txt
          echo "## Browser artifact" >> "$GITHUB_STEP_SUMMARY"
          tail -1 wasm-size.txt >> "$GITHUB_STEP_SUMMARY"
      - name: React playground — deps, test, build (www)
        working-directory: www
        run: |
          npm ci --no-audit --no-fund
          npx playwright-core install --with-deps chromium
          npx vitest run
          npm run build
      - name: Node tier smoke + browser tier
        run: ./dev/wasm-test.sh
      - name: Upload the wasm bundle (release asset source)
        uses: actions/upload-artifact@v6
        with:
          name: antares-wasm-pkg
          path: www/pkg

  matrix:
    # The reusable cell matrix at the FULL preset (default): all seven cells
    # — memory/file/postgres/timescale, both rolling -nats fleets, wasm-file
    # — each running every suite serially against one stack with the
    # between-suite reset.
    name: ETSI cell matrix
    # GATE: same graph as ci.yml — no image build / ETSI run on a red
    # workspace suite.
    needs: workspace
    uses: ./.github/workflows/etsi-matrix.yml
    permissions:
      contents: read
      actions: write # the summary job deletes the merged per-cell artifacts

  k8s-manifests:
    # Lint every reference manifest, then kind-deploy the self-contained
    # subset (nats + postgres-dev + both broker shapes) with the image the
    # build job produced. `rollout status` green == readiness probes
    # (/q/health) answered. The CNPG Cluster is lint-only here — the operator
    # belongs to a real cluster.
    name: K8s reference manifests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: matrix
    steps:
      - uses: actions/checkout@v5
      - name: kubeconform lint
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar xz kubeconform
          ./kubeconform -strict -summary -ignore-missing-schemas deploy/k8s/
      - uses: helm/kind-action@v1
        with:
          cluster_name: antares-smoke
      - uses: actions/download-artifact@v7
        with:
          name: antares-image
      - name: Load the image under test
        run: |
          gunzip antares-image.tgz
          kind load image-archive antares-image.tar --name antares-smoke
      - name: Deploy the self-contained subset
        run: |
          kubectl apply -f deploy/k8s/namespace.yaml
          kubectl apply -f deploy/k8s/nats.yaml -f deploy/k8s/postgres-dev.yaml
          # kind has one PG: point the brokers at postgres-dev instead of CNPG,
          # and a single-node NATS quorum: R1 streams
          sed -e 's|antares-pg-rw.antares.svc|postgres.antares.svc|' \
              -e 's|value: "3"|value: "1"|' deploy/k8s/broker-postgres.yaml \
            | kubectl apply -f -
          kubectl apply -f deploy/k8s/broker-file.yaml
      - name: Wait for every rollout
        run: |
          kubectl -n antares rollout status statefulset/nats --timeout=180s
          kubectl -n antares rollout status deploy/postgres-dev --timeout=180s
          kubectl -n antares rollout status deploy/antares-api --timeout=300s
          kubectl -n antares rollout status deploy/antares-worker --timeout=300s
          kubectl -n antares rollout status deploy/antares-file --timeout=300s
          kubectl -n antares get pods -o wide

  # etsi-serial was REMOVED 2026-08-16: it duplicated the matrix exactly.
  # Its comment claimed the matrix cells got a fresh stack per suite — true
  # in the 32-cell era, stale since the matrix became all-suites-per-cell:
  # every cell now runs the suites IN ORDER against ONE stack with the
  # between-suite reset, which is precisely what serial proved.

  etsi-wasm:
    # The Node tier — the serial ETSI suites against the BROWSER
    # artifact: five node shims serving the same .wasm a page loads
    # (WASM=1 in the one pipeline). MQTT stays excluded (no MQTT sink in a
    # browser build) and there is no RSS gate (the wasm size budget is the
    # artifact's own gate). Serial-tier cadence: tags,
    # nightly, manual.
    name: wasm Node tier (serial suites)
    needs: [workspace, wasm]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Fetch the ETSI test suite (submodule)
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule sync
          git submodule update --init --depth 1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: wasm toolchain
        run: |
          ./dev/install-wasm-tools.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Serial suites against the wasm shims
        env:
          WASM: "1"
          STORE: memory
          STOP_ON_ERROR: "0"
          CALLBACK_HOST: localhost
          RESULTS_DIR: results/wasm-node
        run: ./dev/etsi-pipeline.sh || true
      - name: Upload wasm-tier results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ETSI-wasm-node
          path: |
            results/wasm-node/run-summary.md
            results/wasm-node/gate-status.txt
            results/wasm-node/failures.csv
            results/wasm-node/**/log.html
            results/wasm-node/**/report.html
          retention-days: 14
      - name: Gate — the wasm Node tier is green
        run: |
          gate=$(cat results/wasm-node/gate-status.txt 2>/dev/null || echo MISSING)
          echo "wasm Node tier gate = $gate"
          cat results/wasm-node/run-summary.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          [ "$gate" = PASS ]

  etsi-roll:
    # The ETSI-during-roll gate. The FULL suite runs through the
    # haproxy while dev/rolling-update.sh rolls the two broker1 replicas
    # underneath it in a loop, postgres mode (shared state + bus=nats — the
    # only rung where a roll is defined). The suite has no
    # retries and asserts exact single responses, which makes it a brutally
    # strict drain client: ANY red TP here is a real drain bug, never
    # flake. Runs with the serial tier (nightly / tags / dispatch) — it is
    # a full-suite wall-clock cost, not a per-commit one.
    name: roll-under-suite (postgres)
    needs: [workspace, matrix]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Fetch the ETSI test suite (submodule)
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule sync
          git submodule update --init --depth 1

      - name: Load the image built once for all jobs
        uses: actions/download-artifact@v7
        with:
          name: antares-image

      - run: docker load < antares-image.tgz

      - name: Full suite through the LB while the brokers roll
        env:
          STORE: postgres
          HA: "1"
          ROLL_DURING_RUN: "1"
          SKIP_BUILD: "1"
          STOP_ON_ERROR: "0"
          CALLBACK_HOST: localhost
          RESULTS_DIR: results/roll-postgres
        run: ./dev/etsi-pipeline.sh || true

      - name: Upload roll results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ETSI-roll-postgres
          path: |
            results/roll-postgres/run-summary.md
            results/roll-postgres/gate-status.txt
            results/roll-postgres/failures.csv
            results/roll-postgres/roll-loop.log
            results/roll-postgres/**/log.html
            results/roll-postgres/**/report.html
          retention-days: 14

      - name: Gate — green under continuous rolls
        run: |
          gate=$(cat results/roll-postgres/gate-status.txt 2>/dev/null || echo MISSING)
          echo "K8 roll gate = $gate"
          cat results/roll-postgres/run-summary.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          [ "$gate" = PASS ]

  build-arm:
    # The arm64 half of the released manifest — BUILT, never tested
    # (decision 2026-08-07): all gates run amd64 only; the arm signal is
    # ci.yml's workspace job testing natively on arm. No QEMU.
    name: Build the arm64 image (untested)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build antares-local:arm64 (own cache scope)
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: antares-local:arm64
          load: true
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64

      - name: Export it for the publish job
        run: docker save antares-local:arm64 | gzip > antares-image-arm64.tgz

      - uses: actions/upload-artifact@v6
        with:
          name: antares-image-arm64
          path: antares-image-arm64.tgz
          retention-days: 3

  publish-release:
    # A version tag is the only thing that mints a production image, and it
    # needs ALL THREE gates: the store matrix, the serial all-suites run,
    # and the roll-under-suite drill.
    name: Publish the release image to GHCR
    if: startsWith(github.ref, 'refs/tags/v') && success()
    needs: [matrix, etsi-roll, build-arm]
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Download the tested image
        uses: actions/download-artifact@v7
        with:
          name: antares-image

      - name: Download the arm64 image
        uses: actions/download-artifact@v7
        with:
          name: antares-image-arm64

      - name: Push amd64 (the EXACT image both gates tested) + arm64, stitch the manifest
        run: |
          docker load < antares-image.tgz
          docker load < antares-image-arm64.tgz
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          IMG=ghcr.io/${{ github.repository_owner }}/antares-broker
          VER="${GITHUB_REF#refs/tags/}"
          SHA=${GITHUB_SHA::7}
          docker tag antares-local:latest "$IMG:$SHA-amd64"
          docker tag antares-local:arm64 "$IMG:$SHA-arm64"
          docker push "$IMG:$SHA-amd64"
          docker push "$IMG:$SHA-arm64"
          docker buildx imagetools create \
            -t "$IMG:$VER" -t "$IMG:$SHA" -t "$IMG:latest" \
            "$IMG:$SHA-amd64" "$IMG:$SHA-arm64"
          echo -e "\n## Released: \`$IMG:$VER\` + \`$IMG:latest\` (multi-arch amd64+arm64; amd64 = the tested bytes, matrix + serial, all four store modes green)" >> "$GITHUB_STEP_SUMMARY"

  release-binaries:
    # Static musl binaries per arch — release assets.
    name: Release binary (${{ matrix.target }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: workspace
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get install -y -q musl-tools
      - name: Build + package
        run: |
          cargo build --release --target ${{ matrix.target }} -p antares-broker
          strip "target/${{ matrix.target }}/release/antares"
          VER="${GITHUB_REF#refs/tags/}"
          tar czf "antares-$VER-${{ matrix.target }}.tar.gz"             -C "target/${{ matrix.target }}/release" antares             -C "$GITHUB_WORKSPACE" LICENSE README.md
      - uses: actions/upload-artifact@v6
        with:
          name: release-bin-${{ matrix.target }}
          path: antares-*.tar.gz

  github-release:
    # The GitHub Release — gated on the SAME green the image needed,
    # with binaries, the wasm bundle, an SBOM, and a signed image.
    name: GitHub Release (assets + SBOM + signature)
    if: startsWith(github.ref, 'refs/tags/v') && success()
    needs: [publish-release, release-binaries, wasm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write # cosign keyless
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          pattern: release-bin-*
          merge-multiple: true
      - uses: actions/download-artifact@v7
        with:
          name: antares-wasm-pkg
          path: wasm-pkg
      - name: Zip the wasm bundle
        run: |
          VER="${GITHUB_REF#refs/tags/}"
          (cd wasm-pkg && zip -qr "../antares-wasm-$VER.zip" .)
      - name: SBOM (syft, spdx-json) of the released image
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository_owner }}/antares-broker:${{ github.ref_name }}
          format: spdx-json
          output-file: antares-${{ github.ref_name }}.sbom.spdx.json
          upload-artifact: false
      - name: Sign the image (cosign keyless)
        uses: sigstore/cosign-installer@v3
      - run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          cosign sign --yes "ghcr.io/${{ github.repository_owner }}/antares-broker:${{ github.ref_name }}"
      - name: Release notes from CHANGELOG
        run: |
          VER="${GITHUB_REF#refs/tags/}"
          awk -v ver="$VER" '
            /^## / { on = index($0, "[" substr(ver,2) "]") || index($0, "[Unreleased]") }
            on && !/^## / { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${GITHUB_REF#refs/tags/}"
          gh release create "$VER"             --title "Antares $VER" --notes-file notes.md             antares-*.tar.gz "antares-wasm-$VER.zip" "antares-$VER.sbom.spdx.json"
