name: Build and run ETSI Test and publish

on:
  workflow_dispatch: # Manual trigger only

env:
  MEM_LIMIT_MB: 350   # peak-RSS gate, same limit as ScorpioBroker's pipeline

jobs:
  build-and-test:
    name: Build & Run ETSI Tests (single broker)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # publish the ETSI-tested image to GHCR
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch the ETSI test suite (submodule)
        run: |
          # .gitmodules uses the ssh URL; CI has no key — rewrite to https.
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule sync
          git submodule update --init --depth 1

      - name: Build the broker image (the exact artifact under test)
        run: docker build -t antares-local:latest .

      - name: Start the broker
        run: |
          docker run -d --name antares -p 9090:9090 antares-local:latest
          for i in $(seq 1 30); do
            curl -sf localhost:9090/q/health && break || sleep 1
          done
          curl -sf localhost:9090/q/health

      - name: Monitor broker RSS
        run: |
          ( while docker inspect antares >/dev/null 2>&1; do
              docker stats antares --no-stream --format '{{.MemUsage}}' | awk -F/ '{print $1}'
              sleep 2
            done > mem-samples.txt ) &
          echo $! > mem-monitor.pid

      - name: Run the ETSI serial suite
        env:
          BROKER_URL: http://localhost:9090/ngsi-ld/v1
          CALLBACK_HOST: 172.17.0.1   # docker bridge gateway: broker -> runner mock servers
          STOP_ON_ERROR: "0"          # CI runs the WHOLE suite; local default stops at first error
        run: ./dev/etsi-run.sh || true

      - name: Publish run summary + failures to the job summary
        if: always()
        run: |
          python3 - <<'EOF'
          import glob, os, xml.etree.ElementTree as ET
          out = open(os.environ["GITHUB_STEP_SUMMARY"], "a")
          out.write("## ETSI suite results\n\n| Suite | Pass | Fail | Skip |\n|---|---|---|---|\n")
          fails = []
          for path in sorted(glob.glob("results/*/output.xml")):
              name = path.split("/")[1]
              try:
                  root = ET.parse(path).getroot()
              except Exception as e:
                  out.write(f"| {name} | — | — | unreadable: {e} |\n"); continue
              stat = root.find("./statistics/total/stat")
              p, f, s = (int(stat.get(k, "0")) for k in ("pass", "fail", "skip"))
              out.write(f"| {name} | {p} | {f} | {s} |\n")
              for test in root.iter("test"):
                  st = test.find("status")
                  txt = (st.text or "").strip()
                  if st.get("status") == "FAIL" and "exit-on-failure" not in txt:
                      fails.append((name, test.get("name"), txt[:200]))
          if fails:
              out.write(f"\n### Failures ({len(fails)}) — first 50\n\n")
              for name, test, msg in fails[:50]:
                  out.write(f"- **{name} / {test}**: {msg}\n")
          out.close()
          EOF

      - name: Gate — 100% green AND within the memory limit
        id: gate
        if: always()
        run: |
          kill "$(cat mem-monitor.pid)" 2>/dev/null || true
          python3 - <<'EOF'
          import glob, os, re, sys, xml.etree.ElementTree as ET
          problems, total = [], 0
          outputs = sorted(glob.glob("results/*/output.xml"))
          if not outputs:
              problems.append("no results at all — suite did not run")
          for path in outputs:
              name = path.split("/")[1]
              try:
                  root = ET.parse(path).getroot()
              except Exception as e:
                  problems.append(f"{name}: unreadable output.xml ({e})"); continue
              stat = root.find("./statistics/total/stat")
              p, f, s = (int(stat.get(k, "0")) for k in ("pass", "fail", "skip"))
              if f: problems.append(f"{name}: {f} FAILED")
              if s: problems.append(f"{name}: {s} SKIPPED")
              if p == 0: problems.append(f"{name}: 0 tests passed")
              total += p
          # memory gate: peak of the docker-stats samples (MiB/GiB units)
          peak = 0.0
          try:
              for line in open("mem-samples.txt"):
                  m = re.match(r"\s*([\d.]+)\s*([MG])iB", line)
                  if m:
                      v = float(m.group(1)) * (1024 if m.group(2) == "G" else 1)
                      peak = max(peak, v)
          except OSError:
              problems.append("memory samples missing")
          limit = float(os.environ.get("MEM_LIMIT_MB", "350"))
          mem_ok = peak > 0 and peak <= limit
          if not mem_ok:
              problems.append(f"memory gate: peak {peak:.0f} MiB vs limit {limit:.0f} MiB")
          green = not problems
          with open(os.environ["GITHUB_OUTPUT"], "a") as o:
              o.write(f"green={str(green).lower()}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as o:
              if green:
                  o.write(f"\n## Publish gate: GREEN — {total} passed, peak RSS {peak:.0f} MiB. Image will be published.\n")
              else:
                  o.write("\n## Publish gate: NOT green — image NOT published\n")
                  o.writelines(f"- {p}\n" for p in problems)
          print(("ALL GREEN" if green else "NOT GREEN"), *problems, sep="\n")
          # Only the memory gate fails the job; test failures just block publishing.
          sys.exit(0 if mem_ok else 1)
          EOF

      - name: Publish the ETSI-green image to GHCR
        if: steps.gate.outputs.green == 'true'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          IMG=ghcr.io/${{ github.repository_owner }}/antares-broker
          docker tag antares-local:latest "$IMG:${GITHUB_SHA::7}"
          docker tag antares-local:latest "$IMG:latest"
          docker push "$IMG:${GITHUB_SHA::7}"
          docker push "$IMG:latest"
          echo -e "\n## Published: \`$IMG:${GITHUB_SHA::7}\` + \`$IMG:latest\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Tear down
        if: always()
        run: docker rm -f antares || true

      - name: Upload ETSI Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ETSI-Serial-Reports
          path: |
            results/
            mem-samples.txt
          retention-days: 14
