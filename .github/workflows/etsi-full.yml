name: etsi-full

# The production-proof matrix on a cadence: ALL SEVEN ETSI cells (memory,
# file, postgres, timescale, postgres-nats + timescale-nats rolling role
# fleets, dockerized wasm-file) — the runs too heavy for every commit.
# Cadence decision 2026-08-16: per-commit ci.yml gates on the QUICK preset
# (file/postgres/timescale); this workflow carries the full grid every
# 3 days + on demand. Its ETSI-matrix-results bundle is what the Pages
# report + the seven README badges render (pages.yml listens to THIS
# workflow, not ci) — so the public numbers always describe a full run.
# The haproxy rolling-update drill stays in roll-weekly.yml; v* tags
# run the same full preset via full.yml.

on:
  schedule:
    # every 3rd day-of-month; offset from etsi-coverage (Mon 04:41) and
    # roll-weekly (Tue 04:17). Cron cannot do a true 72 h period — the
    # month-boundary gap (31st -> 1st) is accepted.
    - cron: "23 3 */3 * *"
  workflow_dispatch:

concurrency:
  group: etsi-full
  cancel-in-progress: false

jobs:
  workspace:
    # Same gate as every other run (shared workflow_call definition):
    # workspace tests first, then builds, then the matrix.
    name: Workspace tests
    uses: ./.github/workflows/workspace.yml

  matrix:
    name: ETSI full matrix (7 cells)
    needs: workspace
    uses: ./.github/workflows/etsi-matrix.yml
    with:
      preset: full
    permissions:
      contents: read
      actions: write # the summary job deletes the merged per-cell artifacts

  publish-wasm:
    # The wasm broker image publishes HERE — after the wasm-file cell ran
    # the full ETSI suite against these exact bytes (decision 2026-08-16:
    # per-commit ci carries no wasm at all; publish follows proof). The
    # bundle is the matrix's own antares-wasm-pkg artifact.
    name: Publish the wasm dev image to GHCR
    if: success()
    needs: matrix
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Download the ETSI-tested wasm bundle
        uses: actions/download-artifact@v7
        with:
          name: antares-wasm-pkg
          path: www/pkg

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push antares-wasm-broker:dev (multi-arch — the .wasm bytes are arch-neutral)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.wasm
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/antares-wasm-broker:dev
            ghcr.io/${{ github.repository_owner }}/antares-wasm-broker:dev-${{ github.run_number }}
