name: ci

# The DEV pipeline — workspace tests GATE everything downstream:
#
#   workspace tests ──→ [image build → quick matrix (file postgres timescale) → summary]
#                   ├──→ build arm64 image ─────────────┐
#                   └──→ build wasm bundle (smoked) ────┴→ publish :dev (master, all green)
#
# fmt + clippy + the full workspace suite run FIRST (the shared
# workspace.yml). If any of them fail no image or bundle is built and the
# ETSI matrix never runs — the whole pipeline stops at the gate.
#
# Nothing else lives here. The full seven-cell matrix runs in etsi-full.yml
# (every 3 days) and full.yml (v* tags); the browser-tier wasm proof, K8
# roll-under-suite, N7a and the k8s manifest smoke are full.yml. The matrix
# itself is the reusable etsi-matrix.yml, shared by all three pipelines.

# Runs on push to master, on pull requests, and on manual dispatch.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A newer commit supersedes a running pipeline.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    # The shared workspace-test gate (workflow_call) — one definition for
    # ci/full/etsi-full, see .github/workflows/workspace.yml.
    name: Workspace tests
    uses: ./.github/workflows/workspace.yml

  matrix:
    # The per-commit ETSI gate: the QUICK preset (file postgres timescale).
    # The full seven-cell matrix runs every 3 days in etsi-full.yml, on v*
    # tags in full.yml, and by manual dispatch — cadence decision 2026-08-16.
    name: ETSI cell matrix
    # GATE: no image build / ETSI run unless the workspace suite is green.
    needs: workspace
    uses: ./.github/workflows/etsi-matrix.yml
    with:
      preset: quick
    permissions:
      contents: read
      actions: write # the summary job deletes the merged per-cell artifacts

  build-arm:
    # The arm64 half of the published manifest — BUILT, never tested
    # (decision 2026-08-07): the ETSI matrix + RSS gates run amd64 only.
    # The only arm signal is the workspace job, which compiles and tests the
    # same code natively on ubuntu-24.04-arm. Native-arch runner, no QEMU.
    name: Build the arm64 image (untested)
    # GATE: only build after the workspace suite passes.
    needs: workspace
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build antares-local:arm64 (own cache scope)
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: antares-local:arm64
          load: true
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64

      - name: Export it for the publish job
        run: docker save antares-local:arm64 | gzip > antares-image-arm64.tgz

      - uses: actions/upload-artifact@v6
        with:
          name: antares-image-arm64
          path: antares-image-arm64.tgz
          retention-days: 3

  build-wasm:
    # The browser artifact half of the master publish — built per commit,
    # gated by the node + file tiers of dev/wasm-test.sh (the same shim +
    # store the ETSI wasm-file cell exercises; the chromium browser tier and
    # the full ETSI proof stay in wasm.yml / etsi-full.yml — same precedent
    # as build-arm: publish what compiles + smokes, prove fully on cadence).
    name: Build the wasm bundle (node+file smoke)
    needs: workspace
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Build + size budget + node/file tier smoke
        run: |
          ./dev/install-wasm-tools.sh
          export PATH="$HOME/.local/bin:$PATH"
          ./dev/wasm-build.sh
          BROWSER_TIER=0 ./dev/wasm-test.sh
      - uses: actions/upload-artifact@v6
        with:
          name: antares-wasm-pkg
          path: www/pkg
          retention-days: 14

  publish-dev:
    # Every green commit on master ships the DEV artifacts: the multi-arch
    # broker image AND the wasm broker image (Dockerfile.wasm over the same
    # www/pkg bytes a page loads), each under the sha and a moving `dev`
    # tag. Never `latest` — that belongs to a released version, so
    # `docker pull …:latest` can't silently land on an untagged master build.
    name: Publish the dev images to GHCR
    # Master pushes/dispatches publish :dev; PRs never do. All signals —
    # workspace tests, the cell matrix (quick preset, all 8 suites incl.
    # IOP per cell) and both artifact builds — must be green.
    if: github.ref == 'refs/heads/master' && success()
    needs: [workspace, matrix, build-arm, build-wasm]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Download the wasm bundle
        uses: actions/download-artifact@v7
        with:
          name: antares-wasm-pkg
          path: www/pkg

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the wasm broker image (multi-arch — the .wasm bytes are arch-neutral)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.wasm
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/antares-wasm-broker:dev
            ghcr.io/${{ github.repository_owner }}/antares-wasm-broker:dev-${{ github.run_number }}
      - name: Download the tested image
        uses: actions/download-artifact@v7
        with:
          name: antares-image

      - name: Download the arm64 image
        uses: actions/download-artifact@v7
        with:
          name: antares-image-arm64

      - name: Push amd64 (the EXACT image the matrix tested) + arm64, stitch the manifest
        run: |
          docker load < antares-image.tgz
          docker load < antares-image-arm64.tgz
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          IMG=ghcr.io/${{ github.repository_owner }}/antares-broker
          SHA=${GITHUB_SHA::7}
          docker tag antares-local:latest "$IMG:$SHA-amd64"
          docker tag antares-local:arm64 "$IMG:$SHA-arm64"
          docker push "$IMG:$SHA-amd64"
          docker push "$IMG:$SHA-arm64"
          docker buildx imagetools create \
            -t "$IMG:$SHA" -t "$IMG:dev" -t "$IMG:dev-${{ github.run_number }}" \
            "$IMG:$SHA-amd64" "$IMG:$SHA-arm64"
          echo -e "\n## Published dev: \`$IMG:dev\` + \`$IMG:dev-${{ github.run_number }}\` + \`$IMG:$SHA\` (multi-arch amd64+arm64; amd64 = the tested bytes, all store gates green)" >> "$GITHUB_STEP_SUMMARY"
          echo "Also published: \`ghcr.io/${{ github.repository_owner }}/antares-wasm-broker:dev\` (multi-arch, Dockerfile.wasm over the node+file-smoked bundle) + the \`antares-wasm-pkg\` artifact (www/pkg, drop-in for a page)" >> "$GITHUB_STEP_SUMMARY"
