name: ci

# The DEV pipeline — workspace tests GATE everything downstream:
#
#   workspace tests ──→ [image build → 3-store (file postgres timescale) all-suites matrix → summary]
#                   └──→ build arm64 image ──────────────────────────────→ publish :dev (master, all green)
#
# fmt + clippy + the full workspace suite run FIRST. If any of them fail the
# image is never built and the ETSI matrix never runs — the whole pipeline
# stops at the gate (matrix + build-arm `needs: workspace`).
#
# Nothing else lives here. The browser/wasm artifact, the serial all-suites
# runs, K8 roll-under-suite, N7a and the k8s manifest smoke are full.yml
# (manual dispatch or v* tags). The matrix itself is the reusable
# etsi-matrix.yml, shared by both pipelines.

# Runs on push to master, on pull requests, and on manual dispatch.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A newer commit supersedes a running pipeline.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    # fmt + clippy + the workspace test suite across the feature matrix, with
    # live PostGIS / TimescaleDB / mosquitto so no integration test skips
    # vacuously.
    name: Workspace tests
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      # Live PostGIS for the antares-sql integration tests (C14) — without this
      # they skip vacuously and CI proves nothing about the Pg store.
      ANTARES_TEST_DATABASE_URL: postgresql://antares:antares@localhost:15432/antares
      CARGO_TERM_COLOR: always
    services:
      postgis:
        image: ghcr.io/baosystems/postgis:17-3.5
        env:
          POSTGRES_USER: antares
          POSTGRES_PASSWORD: antares
          POSTGRES_DB: antares
        # host ports must stay below 32768: the ephemeral range (32768-60999)
        # collides with random outbound source ports -> "address already in use"
        ports: ["15432:5432"]
        options: >-
          --health-cmd "pg_isready -U antares"
          --health-interval 5s --health-timeout 3s --health-retries 20
      # D5: the store integration tests run against BOTH temporal modes —
      # this one carries the timescaledb extension (plus PostGIS).
      timescaledb:
        image: timescale/timescaledb-ha:pg17
        env:
          POSTGRES_USER: antares
          POSTGRES_PASSWORD: antares
          POSTGRES_DB: antares
        ports: ["15433:5432"]
        options: >-
          --health-cmd "pg_isready -U antares"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # Live MQTT server for the clause-7 e2e (G1) — without the env var the
      # test skips vacuously and CI proves nothing about MQTT delivery.
      - name: Start mosquitto for the MQTT e2e
        run: |
          sudo apt-get install -y -qq mosquitto
          printf 'allow_anonymous true\nlistener 1883\n' | sudo tee /etc/mosquitto/conf.d/antares-e2e.conf
          sudo systemctl restart mosquitto
          echo "ANTARES_TEST_MQTT_URL=mqtt://127.0.0.1:1883" >> "$GITHUB_ENV"
      # Live NATS (JetStream) for the F9 bus tests + the 2-instance roles e2e.
      # A `docker run` step, not a service: services cannot pass the `-js`
      # command argument the JetStream engine needs.
      - name: Start NATS (JetStream) for the bus tests
        run: |
          docker run -d --name nats -p 4222:4222 nats:2-alpine -js
          echo "ANTARES_TEST_NATS_URL=nats://127.0.0.1:4222" >> "$GITHUB_ENV"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # feature matrix (§9.5): no defaults + all features
      - run: cargo test --workspace --no-default-features
      - run: cargo test --workspace --all-features
      # D5: same store tests, timescale temporal mode (hypertable DDL branch,
      # compression-vs-RLS ordering, D3 detection).
      - name: Store tests against the timescale temporal mode
        env:
          ANTARES_TEST_DATABASE_URL: postgresql://antares:antares@localhost:15433/antares
        run: |
          # psql is not preinstalled on the arm runner image (exit 127)
          which psql >/dev/null || sudo apt-get install -y -qq postgresql-client
          PGPASSWORD=antares psql -h localhost -p 15433 -U antares -d antares \
            -c "CREATE EXTENSION IF NOT EXISTS timescaledb"
          cargo test -p antares-sql
      # D4/§16.5: license gate (nothing links TSL — Timescale is talked to
      # over SQL only) + advisories. Not the cargo-deny-action: its docker
      # image ships an x86_64 binary — Exec format error on this arm runner.
      - name: cargo-deny (licenses + advisories)
        run: |
          V=0.20.2
          curl -sSfL "https://github.com/EmbarkStudios/cargo-deny/releases/download/${V}/cargo-deny-${V}-aarch64-unknown-linux-musl.tar.gz" \
            | tar xz -C "$HOME/.cargo/bin" --strip-components=1 --wildcards '*/cargo-deny'
          cargo deny --log-level warn check licenses advisories
      # E9g: the ETSI resource sampler + its sample↔TP join fail silently when
      # broken (an empty column reads as "nothing happened") — check them here.
      - name: ETSI sampling self-check
        run: python3 dev/etsi-selftest.py
      # SQL-injection guard (§16.2): no string-built queries outside antares-sql
      - name: no format! into SQL outside the compiler
        run: |
          ! grep -rn 'sqlx::query(&format!' crates/ --include='*.rs' \
            | grep -v 'crates/antares-sql/'

  matrix:
    # The reusable 3-store (file postgres timescale) all-suites matrix (build → cells → summary) —
    # shared with full.yml so both pipelines test the same shape.
    name: ETSI cell matrix
    # GATE: no image build / ETSI run unless the workspace suite is green.
    needs: workspace
    uses: ./.github/workflows/etsi-matrix.yml
    permissions:
      contents: read
      actions: write # the summary job deletes the merged per-cell artifacts

  build-arm:
    # The arm64 half of the published manifest — BUILT, never tested
    # (decision 2026-08-07): the ETSI matrix + RSS gates run amd64 only.
    # The only arm signal is the workspace job, which compiles and tests the
    # same code natively on ubuntu-24.04-arm. Native-arch runner, no QEMU.
    name: Build the arm64 image (untested)
    # GATE: only build after the workspace suite passes.
    needs: workspace
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build antares-local:arm64 (own cache scope)
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: antares-local:arm64
          load: true
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64

      - name: Export it for the publish job
        run: docker save antares-local:arm64 | gzip > antares-image-arm64.tgz

      - uses: actions/upload-artifact@v6
        with:
          name: antares-image-arm64
          path: antares-image-arm64.tgz
          retention-days: 3

  publish-dev:
    # Every green commit on master ships a DEV image: the sha and a moving
    # `dev` tag. Never `latest` — that belongs to a released version, so
    # `docker pull …:latest` can't silently land on an untagged master build.
    name: Publish the dev image to GHCR
    # Master pushes/dispatches publish :dev; PRs never do. Both signals —
    # workspace tests AND the cell matrix — must be green.
    if: github.ref == 'refs/heads/master' && success()
    needs: [workspace, matrix, build-arm]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Download the tested image
        uses: actions/download-artifact@v7
        with:
          name: antares-image

      - name: Download the arm64 image
        uses: actions/download-artifact@v7
        with:
          name: antares-image-arm64

      - name: Push amd64 (the EXACT image the matrix tested) + arm64, stitch the manifest
        run: |
          docker load < antares-image.tgz
          docker load < antares-image-arm64.tgz
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          IMG=ghcr.io/${{ github.repository_owner }}/antares-broker
          SHA=${GITHUB_SHA::7}
          docker tag antares-local:latest "$IMG:$SHA-amd64"
          docker tag antares-local:arm64 "$IMG:$SHA-arm64"
          docker push "$IMG:$SHA-amd64"
          docker push "$IMG:$SHA-arm64"
          docker buildx imagetools create \
            -t "$IMG:$SHA" -t "$IMG:dev" -t "$IMG:dev-${{ github.run_number }}" \
            "$IMG:$SHA-amd64" "$IMG:$SHA-arm64"
          echo -e "\n## Published dev: \`$IMG:dev\` + \`$IMG:dev-${{ github.run_number }}\` + \`$IMG:$SHA\` (multi-arch amd64+arm64; amd64 = the tested bytes, all store gates green)" >> "$GITHUB_STEP_SUMMARY"
