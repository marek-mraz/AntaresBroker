name: ci

# The DEV pipeline — fastest possible signal on every commit:
#
#   workspace tests  ∥  [image build → 32-cell store × suite matrix → summary]
#                     └────────────→ publish :dev (master, both green)
#
# Nothing else lives here. The browser/wasm artifact, the serial all-suites
# runs, K8 roll-under-suite, N7a and the k8s manifest smoke are full.yml
# (manual dispatch or v* tags). The matrix itself is the reusable
# etsi-matrix.yml, shared by both pipelines.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A newer commit supersedes a running pipeline.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    # fmt + clippy + the workspace test suite across the feature matrix, with
    # live PostGIS / TimescaleDB / mosquitto so no integration test skips
    # vacuously.
    name: Workspace tests
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      # Live PostGIS for the antares-sql integration tests (C14) — without this
      # they skip vacuously and CI proves nothing about the Pg store.
      ANTARES_TEST_DATABASE_URL: postgresql://antares:antares@localhost:54329/antares
      CARGO_TERM_COLOR: always
    services:
      postgis:
        image: ghcr.io/baosystems/postgis:17-3.5
        env:
          POSTGRES_USER: antares
          POSTGRES_PASSWORD: antares
          POSTGRES_DB: antares
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U antares"
          --health-interval 5s --health-timeout 3s --health-retries 20
      # D5: the store integration tests run against BOTH temporal modes —
      # this one carries the timescaledb extension (plus PostGIS).
      timescaledb:
        image: timescale/timescaledb-ha:pg17
        env:
          POSTGRES_USER: antares
          POSTGRES_PASSWORD: antares
          POSTGRES_DB: antares
        ports: ["54330:5432"]
        options: >-
          --health-cmd "pg_isready -U antares"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # Live MQTT server for the clause-7 e2e (G1) — without the env var the
      # test skips vacuously and CI proves nothing about MQTT delivery.
      - name: Start mosquitto for the MQTT e2e
        run: |
          sudo apt-get install -y -qq mosquitto
          printf 'allow_anonymous true\nlistener 1883\n' | sudo tee /etc/mosquitto/conf.d/antares-e2e.conf
          sudo systemctl restart mosquitto
          echo "ANTARES_TEST_MQTT_URL=mqtt://127.0.0.1:1883" >> "$GITHUB_ENV"
      # Live NATS (JetStream) for the F9 bus tests + the 2-instance roles e2e.
      # A `docker run` step, not a service: services cannot pass the `-js`
      # command argument the JetStream engine needs.
      - name: Start NATS (JetStream) for the bus tests
        run: |
          docker run -d --name nats -p 4222:4222 nats:2-alpine -js
          echo "ANTARES_TEST_NATS_URL=nats://127.0.0.1:4222" >> "$GITHUB_ENV"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # feature matrix (§9.5): no defaults + all features
      - run: cargo test --workspace --no-default-features
      - run: cargo test --workspace --all-features
      # D5: same store tests, timescale temporal mode (hypertable DDL branch,
      # compression-vs-RLS ordering, D3 detection).
      - name: Store tests against the timescale temporal mode
        env:
          ANTARES_TEST_DATABASE_URL: postgresql://antares:antares@localhost:54330/antares
        run: |
          PGPASSWORD=antares psql -h localhost -p 54330 -U antares -d antares \
            -c "CREATE EXTENSION IF NOT EXISTS timescaledb"
          cargo test -p antares-sql
      # D4/§16.5: license gate (nothing links TSL — Timescale is talked to
      # over SQL only) + advisories.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses advisories
      # E9g: the ETSI resource sampler + its sample↔TP join fail silently when
      # broken (an empty column reads as "nothing happened") — check them here.
      - name: ETSI sampling self-check
        run: python3 dev/etsi-selftest.py
      # SQL-injection guard (§16.2): no string-built queries outside antares-sql
      - name: no format! into SQL outside the compiler
        run: |
          ! grep -rn 'sqlx::query(&format!' crates/ --include='*.rs' \
            | grep -v 'crates/antares-sql/'

  matrix:
    # The reusable 32-cell store × suite matrix (build → cells → summary) —
    # shared with full.yml so both pipelines test the same shape.
    name: ETSI cell matrix
    uses: ./.github/workflows/etsi-matrix.yml
    permissions:
      contents: read
      actions: write # the summary job deletes the merged per-cell artifacts

  publish-dev:
    # Every green commit on master ships a DEV image: the sha and a moving
    # `dev` tag. Never `latest` — that belongs to a released version, so
    # `docker pull …:latest` can't silently land on an untagged master build.
    name: Publish the dev image to GHCR
    # Master pushes/dispatches publish :dev; PRs never do. Both signals —
    # workspace tests AND the cell matrix — must be green.
    if: github.ref == 'refs/heads/master' && success()
    needs: [workspace, matrix]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Download the tested image
        uses: actions/download-artifact@v4
        with:
          name: antares-image

      - name: Push the EXACT image the matrix tested
        run: |
          docker load < antares-image.tgz
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          IMG=ghcr.io/${{ github.repository_owner }}/antares-broker
          docker tag antares-local:latest "$IMG:${GITHUB_SHA::7}"
          docker tag antares-local:latest "$IMG:dev"
          docker push "$IMG:${GITHUB_SHA::7}"
          docker push "$IMG:dev"
          echo -e "\n## Published dev: \`$IMG:dev\` + \`$IMG:${GITHUB_SHA::7}\` (32/32 matrix cells green)" >> "$GITHUB_STEP_SUMMARY"
