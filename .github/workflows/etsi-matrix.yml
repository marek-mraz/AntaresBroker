name: etsi-matrix

# Reusable (workflow_call only): ONE image build feeding the 32-cell
# store × suite ETSI matrix, folded into the per-store summary tables.
# Callers: ci.yml (every commit) and full.yml (manual / v* tags).

on:
  workflow_call:

env:
  MEM_LIMIT_MB: 350 # per-broker peak-RSS gate, same limit as ScorpioBroker's pipeline

jobs:
  build:
    # ONE image for the whole run. Every store mode tests the SAME bytes, and
    # the image that ships is the image the suites ran against. Runs alongside
    # the workspace job (one runner, no fan-out) — only the 32-cell matrix
    # waits for tests to be green.
    name: Build the image under test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build antares-local:latest
        run: docker build -t antares-local:latest .

      - name: Export it for the mode jobs
        run: docker save antares-local:latest | gzip > antares-image.tgz

      - uses: actions/upload-artifact@v4
        with:
          name: antares-image
          path: antares-image.tgz
          retention-days: 3

      - name: Report image size
        run: |
          echo "## Image under test" >> "$GITHUB_STEP_SUMMARY"
          echo "\`antares-local:latest\` — $(docker image inspect antares-local:latest --format '{{.Size}}' | awk '{printf "%.0f MB uncompressed", $1/1024/1024}'), $(du -m antares-image.tgz | cut -f1) MB compressed" >> "$GITHUB_STEP_SUMMARY"

  etsi-cell:
    # E9: full-granularity store × suite matrix — the per-commit conformance
    # signal. Each cell brings up its OWN fresh stack via the SAME pipeline
    # script (E9c: cross-suite pollution gone by construction), filtered with
    # SUITES=. ONE image build feeds all 32 cells (E9b, via the build job's
    # artifact). Not finer than per-suite (E9f): intra-suite sharding only pays
    # once a cell exceeds ~15 min, and then each shard needs its own stack.
    name: ${{ matrix.store }} × ${{ matrix.suite }}
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        store: [memory, file, postgres, timescale]
        suite: [CommonBehaviours, Consumption, Provision, Subscription,
                ContextSource, jsonldContext, DistributedOperations, IOP]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the ETSI test suite (submodule)
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule sync
          git submodule update --init --depth 1

      - name: Load the image built once for all cells
        uses: actions/download-artifact@v4
        with:
          name: antares-image

      - run: docker load < antares-image.tgz

      - name: Run this cell through the ONE pipeline
        env:
          STORE: ${{ matrix.store }}
          SUITES: ${{ matrix.suite }}
          SKIP_BUILD: "1"
          STOP_ON_ERROR: "0"
          CALLBACK_HOST: localhost
        run: ./dev/etsi-pipeline.sh || true

      - name: Upload cell results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ETSI-cell-${{ matrix.store }}-${{ matrix.suite }}
          path: |
            results/${{ matrix.store }}/run-summary.md
            results/${{ matrix.store }}/gate-status.txt
            results/${{ matrix.store }}/failures.csv
            results/${{ matrix.store }}/resource-samples.csv
            results/${{ matrix.store }}/resource-by-test.csv
            results/${{ matrix.store }}/**/log.html
          retention-days: 7

      - name: Gate — this cell 100% green
        run: |
          gate=$(cat "results/${{ matrix.store }}/gate-status.txt" 2>/dev/null || echo MISSING)
          echo "gate(${{ matrix.store }} × ${{ matrix.suite }}) = $gate"
          [ "$gate" = PASS ]

  etsi-aggregate:
    # Fold all 32 cells into ONE downloadable bundle + ONE report: per-store
    # tables (pass/fail/skip + RSS/CPU rollups), the combined per-second
    # resource samples, the combined all-failures file, and a detailed error
    # list. The single required status check; any red/missing cell fails it.
    name: Matrix summary
    if: always()
    needs: etsi-cell
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write # to delete the merged per-cell artifacts
    steps:
      - uses: actions/checkout@v4

      - name: Download all cell results
        uses: actions/download-artifact@v4
        with:
          pattern: ETSI-cell-*
          path: cells

      - name: Fold the cells into the combined bundle + report
        # Gate result captured, not enforced here — the bundle must upload
        # and the summary must render even when cells are red.
        run: ./dev/etsi-matrix-summary.py cells || echo "RED_CELLS=$?" >> "$GITHUB_ENV"

      - name: Upload the ONE results bundle
        id: bundle
        uses: actions/upload-artifact@v4
        with:
          name: ETSI-matrix-results
          path: cells
          retention-days: 14

      - name: Write the step summary (download link first)
        run: |
          {
            echo "# ETSI matrix"
            echo
            echo "⬇️ **[Download ALL results (one bundle)](${{ steps.bundle.outputs.artifact-url }})** — every cell's Robot log.html, \`_combined/all-resource-samples.csv\` (every 1 Hz CPU/RSS sample from every run), \`_combined/all-failures.csv\` (every error with run, keyword ran, expected-vs-got)."
            echo
            cat cells/_combined/matrix-summary.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Delete the merged per-cell artifacts
        # The bundle supersedes them — one download link, not 33.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
            --paginate -q '.artifacts[] | select(.name | startswith("ETSI-cell-")) | .id' |
          while read -r id; do
            gh api --method DELETE "repos/${{ github.repository }}/actions/artifacts/$id"
          done

      - name: Gate — all 32 cells green
        run: test -z "${RED_CELLS:-}"
