name: workspace

# The ONE workspace-test gate — fmt, clippy wall, the full cargo suite
# across the feature matrix with live PostGIS/TimescaleDB/mosquitto/NATS,
# cargo-deny, the ledger check and the SQL-injection guard. Reusable
# (workflow_call): ci.yml (every push) and full.yml (twice a week +
# tags/dispatch) both gate on THIS job, so the graph is identical
# everywhere: workspace -> builds (image ‖ wasm) -> the cell matrix.
# Extracted from the two drifting copies in ci.yml and full.yml.

on:
  workflow_call:

# Compiles and tests the workspace and uploads reports; the token only
# has to read the checkout.
permissions:
  contents: read

jobs:
  workspace:
    # fmt + clippy + the workspace test suite across the feature matrix, with
    # live PostGIS / TimescaleDB / mosquitto so no integration test skips
    # vacuously.
    name: Workspace tests
    # x86, not the arm runner: a COLD workspace clippy there dies with a bare
    # SIGTERM (exit 143) after 3-10 min — no rustc error, no cancel, and the
    # same cold job peaks at 1.2 GB locally. The msrv and shared-crate jobs
    # keep the arm runner, they run fine there.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Live PostGIS for the antares-sql integration tests — without this
      # they skip vacuously and CI proves nothing about the Pg store.
      ANTARES_TEST_DATABASE_URL: postgresql://antares:antares@localhost:15432/antares
      CARGO_TERM_COLOR: always
    services:
      postgis:
        image: ghcr.io/baosystems/postgis:17-3.5
        env:
          POSTGRES_USER: antares
          POSTGRES_PASSWORD: antares
          POSTGRES_DB: antares
        # host ports must stay below 32768: the ephemeral range (32768-60999)
        # collides with random outbound source ports -> "address already in use"
        ports: ["15432:5432"]
        options: >-
          --health-cmd "pg_isready -U antares"
          --health-interval 5s --health-timeout 3s --health-retries 20
      # The store integration tests run against BOTH temporal modes —
      # this one carries the timescaledb extension (plus PostGIS).
      timescaledb:
        image: timescale/timescaledb-ha:pg17
        env:
          POSTGRES_USER: antares
          POSTGRES_PASSWORD: antares
          POSTGRES_DB: antares
        ports: ["15433:5432"]
        options: >-
          --health-cmd "pg_isready -U antares"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      # Five feature-set builds run below, and cargo keeps each one's
      # artifacts side by side in target/ — the last of them linked the
      # broker binary onto a full filesystem and the linker died with
      # `ld terminated with signal 7 [Bus error]`, which reads as a compiler
      # crash and is not one. Reclaim the runtimes this job never uses, and
      # print the free space before and after so the margin is a number in
      # the log rather than something a future run rediscovers as a SIGBUS.
      - name: Reclaim runner disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/local/graalvm /usr/share/swift || true
          df -h /
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          # a red job still saves its target dir, so the retry is warm
          cache-on-failure: true
      # The whole cargo suite runs under nextest so every config emits JUnit
      # (.config/nextest.toml, profile `ci`) — dev/unit-report-site.py folds
      # those into the /reports/unit/ page. Plain `cargo test` leaves no
      # machine-readable trace behind.
      - uses: taiki-e/install-action@nextest
      # Live MQTT server for the clause-7 e2e — without the env var the
      # test skips vacuously and CI proves nothing about MQTT delivery.
      - name: Start mosquitto for the MQTT e2e
        run: |
          sudo apt-get install -y -qq mosquitto
          printf 'allow_anonymous true\nlistener 1883\n' | sudo tee /etc/mosquitto/conf.d/antares-e2e.conf
          sudo systemctl restart mosquitto
          echo "ANTARES_TEST_MQTT_URL=mqtt://127.0.0.1:1883" >> "$GITHUB_ENV"
      # Live NATS (JetStream) for the bus tests + the 2-instance roles e2e.
      # A `docker run` step, not a service: services cannot pass the `-js`
      # command argument the JetStream engine needs.
      - name: Start NATS (JetStream) for the bus tests
        run: |
          docker run -d --name nats -p 4222:4222 nats:2-alpine -js
          echo "ANTARES_TEST_NATS_URL=nats://127.0.0.1:4222" >> "$GITHUB_ENV"
      # Validity gate: a test that returns early on a missing variable passes
      # vacuously and proves nothing, and no report can tell that apart from a
      # real pass. Every `SKIP: <VAR> not set` marker in the tree must name a
      # variable this job supplies, so a new gate either gets its service here
      # or turns the build red.
      - name: no test skips vacuously
        run: |
          vars=$(grep -rhoE 'SKIP: [A-Z_]+(( / )[A-Z_]+)* not set' crates/ \
                   --include='*.rs' \
                 | sed -E 's/^SKIP: //; s/ not set$//' \
                 | tr ' ' '\n' | grep -E '^[A-Z][A-Z_]+$' | sort -u)
          echo "$vars"
          # the markers must still be findable (guard self-test)
          [ "$(echo "$vars" | wc -l)" -ge 3 ]
          rc=0
          for v in $vars; do
            [ -n "${!v:-}" ] || { echo "::error::$v gates a test and is unset here"; rc=1; }
          done
          exit $rc
      - run: cargo fmt --all --check
      # --locked everywhere below: the image builds with it (Dockerfile), so
      # without it CI would gate on a dependency set the shipped binary never
      # used, and an out-of-date Cargo.lock would pass here and fail there.
      # The step has died with a bare SIGTERM (exit 143, no rustc error, no
      # post-steps) on both runner archs. The sampler streams the machine's
      # memory, disk and top processes into the log every 15 s so the last
      # lines before a kill say what was being exhausted.
      - name: cargo clippy (with a resource sampler)
        run: |
          ( while sleep 15; do
              echo "--- $(date -u +%T) $(free -m | awk '/Mem:/{print "mem used "$3" free "$4" avail "$7" MB"}') $(df -h / | awk 'NR==2{print "disk used "$5}')"
              ps -eo rss,comm --sort=-rss | head -4 | tail -3 | awk '{printf "  %s MB %s\n", int($1/1024), $2}'
              docker stats --no-stream --format '  {{.Name}} {{.MemUsage}}' 2>/dev/null
            done ) &
          SAMPLER=$!
          cargo clippy --locked --workspace --all-targets -- -D warnings
          kill $SAMPLER
      - run: dev/unit-junit.sh default --workspace
      # nextest cannot execute doctests. They stay gated here (a broken doc
      # example is still a red build) but contribute no JUnit, which the
      # /reports/unit/ footer says out loud rather than quietly overcounting.
      - run: cargo test --locked --workspace --doc
      # The federated-store and outbox-drain tests are #[ignore] so that a cell
      # without a database reports them as ignored instead of silently passing.
      # This job HAS a database, so it must ask for them by name. Not a blanket
      # --run-ignored all: that would also pull in the release-only timing gate.
      - name: Tests that need a live database
        run: |
          dev/unit-junit.sh ignored-db-api -p antares-api \
            --test split_entities_5_7_2 --test temporal_fed_paging_5_7_4 \
            --run-ignored ignored-only
          dev/unit-junit.sh ignored-db-broker -p antares-broker --bin antares \
            --run-ignored ignored-only outbox_flush_waits
      # The API tests once more on the on-disk redb store: AppState::new
      # composes a fresh file store per state under this harness variable,
      # so every test that passed on memory has to pass on the durable
      # backend too — no second copy of the tests.
      - run: ANTARES_TEST_STORE=file dev/unit-junit.sh file-store -p antares-api
      # feature matrix: no defaults + all features
      - run: dev/unit-junit.sh no-default-features --workspace --no-default-features
      - run: dev/unit-junit.sh all-features --workspace --all-features
      # Same store tests, timescale temporal mode (hypertable DDL branch,
      # compression-vs-RLS ordering, backend detection).
      - name: Store tests against the timescale temporal mode
        env:
          ANTARES_TEST_DATABASE_URL: postgresql://antares:antares@localhost:15433/antares
        run: |
          # psql may not be preinstalled on the runner image (exit 127)
          which psql >/dev/null || sudo apt-get install -y -qq postgresql-client
          PGPASSWORD=antares psql -h localhost -p 15433 -U antares -d antares \
            -c "CREATE EXTENSION IF NOT EXISTS timescaledb"
          # the broker's store×temporal combos too: their timescale rows skip
          # against the plain PostGIS service and only run here for real
          dev/unit-junit.sh timescale-store -p antares-sql -p antares-broker --test store_combos
          # The margin the reclaim left, after the build that fills the most.
          df -h /
      # Uploaded even on a red job: a failing config is exactly the one the
      # reports page must render, and fold-reports.sh takes the NEWEST bundle.
      - name: Unit JUnit bundle (folded into /reports/unit/)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: unit-junit
          path: unit-junit/
          if-no-files-found: warn
      # License gate (nothing links TSL — Timescale is talked to
      # over SQL only) + advisories. A pinned release binary, not the
      # cargo-deny-action, so the job stays portable across runner archs.
      - name: cargo-deny (licenses + advisories)
        run: |
          V=0.20.2
          curl -sSfL "https://github.com/EmbarkStudios/cargo-deny/releases/download/${V}/cargo-deny-${V}-$(uname -m)-unknown-linux-musl.tar.gz" \
            | tar xz -C "$HOME/.cargo/bin" --strip-components=1 --wildcards '*/cargo-deny'
          cargo deny --log-level warn check licenses advisories
      # The ETSI resource sampler + its sample↔TP join fail silently when
      # broken (an empty column reads as "nothing happened") — check them here.
      - name: ETSI sampling self-check
        run: python3 dev/etsi-selftest.py
      # Ledger integrity: a clause file that stops parsing silently
      # drops out of every count — make that (and status typos, robot drift)
      # a red build instead.
      - name: conformance ledger check
        run: pip install --quiet pyyaml && python3 dev/spec.py check

      - name: Env-var docs check
        run: ./dev/check-env-docs.sh
      # SQL-injection guard: dynamically assembled SQL (AssertSqlSafe, or an
      # sqlx query built with format!) belongs to the antares-sql backend
      # source and nowhere else. Everything a request supplies reaches the
      # database as a bind parameter.
      - name: no dynamic SQL outside the backend
        run: |
          # the pattern must exist where expected (guard self-test) …
          grep -rqn 'AssertSqlSafe' crates/antares-sql/src/
          # … and nowhere else in shipped code, examples included; a test
          # that CREATEs its own scratch database has no bind-parameter
          # alternative
          ! grep -rnE 'AssertSqlSafe|sqlx::query[a-z_]*\(&?format!' \
              crates/ examples/ --include='*.rs' \
            | grep -vE 'crates/antares-sql/src/|/tests/'


  msrv:
    # The declared rust-version stays PROVEN as stable moves on.
    name: MSRV check (1.97)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
      - uses: Swatinem/rust-cache@v2
      # --locked matters most here: without it an old cargo would happily
      # resolve older dependency versions and the MSRV claim would be proven
      # against a lockfile nothing else uses.
      - run: cargo check --locked --workspace -j 2

  shared-crates:
    # The reusable crates stand alone: each builds and tests by itself and
    # its dependency tree never reaches the broker, the api or a storage
    # backend — a workspace build would unify features and hide exactly
    # that breakage.
    name: Shared crates standalone
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        crate: [antares-model, antares-ql, antares-jsonld, antares-matcher, antares-store]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked -p ${{ matrix.crate }} -j 2
      - run: cargo test --locked -p ${{ matrix.crate }} -j 2
      # the smallest broker build (every optional feature off) must compile
      - run: cargo check --locked -p antares-broker --no-default-features -j 2
        if: matrix.crate == 'antares-store'
      # antares-sql without its Postgres arm — the shape the wasm and fuzz
      # builds get. A workspace build unifies the feature back on from
      # antares-api, so only a per-crate check sees a break in the gated code.
      # -D warnings because the failure mode here is code that no longer has
      # a caller once the arm is off, which is a warning and would otherwise
      # accumulate unseen until something in this shape stops compiling.
      - run: RUSTFLAGS="-D warnings" cargo check --locked -p antares-sql --no-default-features -j 2
        if: matrix.crate == 'antares-store'
      # The public surface a gateway author reads: every item documented
      # (#![deny(missing_docs)] in the crate) and no broken intra-doc link.
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps --document-private-items -p ${{ matrix.crate }}
      - name: Dependency direction
        run: |
          if cargo tree --locked -p ${{ matrix.crate }} -e normal --prefix none \
             | grep -E '^(antares-api|antares-broker|antares-sql|sqlx|axum|redb) '; then
            echo "::error::${{ matrix.crate }} depends on the broker or a storage backend"; exit 1
          fi
