clause4_languages:
  - clause: "4.9"
    name: "NGSI-LD Query Language (q=)"
    status: implemented
    evidence: "crates/antares-ql/src/lib.rs::parse_q; antares-api/src/qeval.rs; antares-sql/src/compile/q.rs"
    notes: "qeval is the arbiter in every store mode; postgres/timescale additionally push an exact subset into jsonb_path_exists (bound jsonpath, C10). Dotted paths, ~=/!~= and string ordering deliberately do not compile — the compiler declines rather than risk narrowing wrongly. Full CompEqualityValue grammar since 2026-08-09 (audit C2): ValueList (p.90/91 any/none-of semantics incl. array targets), Range (closed interval, != complement), notPatternOp !~= (non-string target = not matching, p.92), != type-mismatch match (p.92), != over arrays universally quantified (p.91); lists/ranges with ordering ops and bools with ordering ops rejected 400 per p.84 grammar pairing. Robot: QueryEntities/019_28 (extension TP — suite has zero list/range/!~= coverage)"
  - clause: "4.10"
    name: "Geoquery Language"
    status: implemented
    evidence: "crates/antares-api/src/geo.rs (DE-9IM relate, H7); antares-sql/src/compile/geo.rs (PostGIS pushdown, C11b); antares-api/tests/pg_query_parity.rs (C11c)"
    notes: "evaluator is the arbiter; postgres/timescale push georel onto the GIST-indexed location column for the DEFAULT GeoProperty only. near compiles for a Point query geometry, with the radius widened for the haversine-vs-spheroid delta so SQL can only narrow. Invalid query geometry or a non-default geoproperty declines to compile"
  - clause: "4.11"
    name: "Temporal Query Language"
    status: implemented
    evidence: "crates/antares-api/src/temporal.rs (timerel/timeAt/endTimeAt/timeproperty); antares-sql/src/compile/temporal.rs (C11 instance pruning)"
    notes: "window() stays the arbiter; postgres/timescale prune instance arrays byte-exactly (COLLATE \"C\" string compare mirroring instance_matches) plus a RANK()-capped lastN that keeps ties; pruning withheld when q=/geo need the full instance set"
  - clause: "4.12–4.13"
    name: "Pagination; counting results"
    status: implemented
    evidence: "crates/antares-api/src/entities.rs::paginate (6.3.10), NGSILD-Results-Count; pg_entity.rs::query (C11 LIMIT/OFFSET pushdown)"
    notes: "postgres/timescale page in SQL (ORDER BY id + count(*) OVER ()) ONLY when every present predicate compiled exactly (the decided gate); idPattern/federation/orderBy or any inexact predicate falls back to evaluator paging"
  - clause: "4.14"
    name: "Multiple tenants"
    status: implemented
    evidence: "crates/antares-model/src/id.rs::TenantId; store keyed by tenant"
    notes: ""
  - clause: "4.15"
    name: "Language Filter (lang=)"
    status: implemented
    evidence: "crates/antares-api/src/repr.rs (lang selection)"
    notes: ""
  - clause: "4.18–4.19"
    name: "Scopes; Scope Query Language (scopeQ)"
    status: implemented
    evidence: "crates/antares-api/src/lib.rs::scope_matches; antares-sql/src/compile/scope.rs (C11)"
    notes: "OR-of-AND with +/# wildcards; postgres/timescale compile it to an anchored regex over unnest(scopes) (GIN-indexed column). Separators match /+ and edge slashes are optional so the compiled form is never stricter than the matcher"
  - clause: "4.16–4.17"
    name: "Multiple entity types; Entity Type Selection Language"
    status: implemented
    evidence: "crates/antares-api/src/entities.rs::type_selection_matches; unit tests type_wildcard_*; TP 019_26"
    notes: "`type=*` fixed 2026-08-09 per Table 6.4.3.2-1: it selects every Entity Type and implicitly sets local, and `type=*&local=false` is BadRequestData. Previously `*` was expanded as an ordinary term, yielding an IRI nothing matched — the query answered 200 with an empty array."
  - clause: "4.18–4.19"
    name: "Scopes; Scope Query Language (scopeQ)"
    status: implemented
    evidence: "crates/antares-api/src/entities.rs, qeval.rs (scopeQ)"
    notes: ""
  - clause: "4.20"
    name: "Distributed Operation names / operation groups"
    status: partial
    evidence: "crates/antares-api/src/federation.rs (operations matching)"
    notes: "ops bitmask + csource_index maintained in-transaction since C7 (pg_doc.rs, Table 4.20-1 order); request-path matching still reads the registration docs — the index's first reader is the §16.7 SQL matching"
  - clause: "4.21"
    name: "Attribute Projection Language (pick/omit)"
    status: implemented
    evidence: "crates/antares-api/src/repr.rs (pick/omit, dotted paths); pg_entity.rs::query (C11 top-level projection pushdown)"
    notes: "repr::apply stays the decider; SQL drops/keeps only top-level attr IRIs under the decided gate — core members always survive, dotted paths stay evaluator-side"
  - clause: "4.22"
    name: "Transient storage (expiresAt) of Entities and Attributes"
    status: implemented
    evidence: "antares-jsonld expand.rs preserves entity- AND instance-level expiresAt as a top-level DateTime (skip list + RESERVED_MEMBERS); antares-sql store/filter.rs::strip_expired (read-boundary invalidity, instant-compared) applied on entity AND temporal reads (any.rs); pg_entity.rs + pg_temporal.rs read predicates; maintenance.rs 4.22 reap + Store::sweep_expired (memory/file), migration 0007"
    notes: "write path FIXED (security audit 2026-08-08): expand.rs previously dropped a client expiresAt into a Property, leaving strip_expired/sweep/expires_at column dead — it is now kept as meta so 4.22 is functional on all four backends. Current-state AND temporal reads refuse expired entities and strip expired instances at the AnyStore boundary; Pg pushes the entity-level expiry into SQL so paging stays exact. GC sweeps run per backend on the ANTARES_SWEEP_SECS tick (default 15 min; ETSI stack 2 s — deletion lag is clause-sanctioned); merge_into applies/removes a fragment expiresAt per 5.5.12 (NGSI-LD Null removes). Validated by extension TPs 422_01 (ngsi-ld-test-suite TransientEntities). Known lag artifact: re-creating an expired-but-unswept id answers 409 until the sweep. No deletion notifications for reaped entities (no TP covers this)"
  - clause: "4.23"
    name: "Entity Ordering (orderBy/orderFrom/orderGeometry/collation)"
    status: partial
    evidence: "crates/antares-api/src/entities.rs (orderBy, datatype order 4.23.2); TP 019_27, D011_05_inc"
    notes: "Local-scope gate added 2026-08-09 (5.7.2.4 + 4.23.1 'Sort ordering is never applied to distributed operations'): orderBy is refused when a registration matches, permitted under local execution. Still missing: dist-asc/dist-desc sorting styles, orderGeometry, collation (ICU), orderFrom is allowlisted but inert, and 4.23.3 bracket sub-item paths (orderBy=address[city])."

