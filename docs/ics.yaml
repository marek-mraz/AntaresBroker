# Antares ICS — Implementation Conformance Statement (CIM 029 shape, §14.6)
# Baseline: ETSI GS CIM 009 V1.9.1 (2025-07). Audited: 2026-08-04 (H0/H1)
# against the v0 code (in-memory + AnyStore cutover tree; ETSI 1025/1025 green,
# MQTT TPs excluded).
#
# status values:
#   implemented  — full normative behaviour present, suite- and/or unit-tested
#   partial      — present but with a named gap (see notes)
#   missing      — not implemented
#   staged-v1x   — deliberately staged after v1.0 (tasks.md / §5.1)
#
# One row per §5.4 ledger checkbox line. Update per PR (tasks.md loop step 5).

