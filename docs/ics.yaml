    status: partial
    evidence: "crates/antares-api/src/negotiate.rs; unit test accept_precedence_follows_the_spec_list_not_header_order; TP 045_02"
    notes: "Accept precedence fixed 2026-08-09: the json > ld+json > geo+json list order is now the tie-break on equal q and equal specificity (was header order, so 'application/ld+json, application/json' wrongly selected ld+json). 411 Length Required implemented 2026-08-09 (bounds.rs) — mandated twice, by 6.3.2 ('shall be raised when an HTTP request does not define the Content-Length HTTP header') and 6.3.4 ('shall result in just a 411 HTTP status code (without any payload body)'); no exemption exists for Transfer-Encoding: chunked. NAMED DEVIATION: the check is scoped to HTTP/1.x, since 6.3.4 is written against RFC 7230/7231 and h2 carries length in its framing. NOTE: the ETSI suite contains ZERO 411 assertions (contrast 415 in 048_01 and 406 in 049_01/02), so this clause has no conformance coverage — unit test missing_content_length_is_a_bare_411 is the only guard. Remaining gap: the 406 body must 'contain the list of the available representations of the resources' but is currently empty."
