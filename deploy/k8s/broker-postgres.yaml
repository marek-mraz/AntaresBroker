# `postgres`-mode reference shape (§9/§10): stateless pods, RollingUpdate,
# roles split — 2× api (HTTP, produces outbox + drains it) and 2× worker
# (matcher,notifier,temporal — shared durables load-balance, interval
# firings single-winner by row-lock claim). ANTARES_BUS=nats is what makes N
# replicas ONE broker (F10); ANTARES_NATS_REPLICAS=3 puts the streams at R3
# on the 3-node cluster (§10).
#
# ANTARES_DATABASE_URL points at CNPG's -rw service (postgres-cnpg.yaml); the
# kind smoke overrides it to the postgres-dev service via kustomize-free env
# (CI patches with sed — one line, no tooling).
apiVersion: v1
kind: Service
metadata:
  name: antares
  namespace: antares
spec:
  selector: { app: antares, role: api }
  ports:
    - { port: 9090 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: antares-api
  namespace: antares
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: antares, role: api }
  template:
    metadata:
      labels: { app: antares, role: api }
    spec:
      # P0-1: the `antares*` Services make kubelet inject ANTARES_PORT/
      # ANTARES_SERVICE_* into every pod — fatal under the unknown-key
      # check. Belt at main.rs skips the injected shapes; this is braces.
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30 # K1: > drain delay + deadline
      # §16.5 runtime hardening: non-root (image is uid 65532), read-only
      # rootfs (postgres mode writes nothing there; /tmp is a tmpfs), all caps
      # dropped, no privilege escalation.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: { type: RuntimeDefault }
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: antares
          image: antares-local:latest
          imagePullPolicy: IfNotPresent
          args: []
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          env:
            - { name: ANTARES_STORE, value: postgres }
            # §16.1 PRODUCTION: point this at a NON-superuser, non-BYPASSRLS role
            # (e.g. antares_app) so the RLS tenant-isolation backstop is enforced,
            # and set ANTARES_REQUIRE_RLS=1 to refuse boot otherwise. Migrations
            # need a privileged role — run them as a separate bootstrap step, then
            # run the broker as antares_app (granted DML on the tenant tables).
            # Left as the superuser DSN here only so the CI kind-smoke (superuser
            # postgres-dev) boots; a real deployment MUST change both.
            - name: ANTARES_DATABASE_URL
              value: postgresql://antares:antares@antares-pg-rw.antares.svc:5432/antares
            # - { name: ANTARES_REQUIRE_RLS, value: "1" }   # enable in production
            - { name: ANTARES_BUS, value: nats }
            - { name: ANTARES_NATS_URL, value: "nats://nats.antares.svc:4222" }
            - { name: ANTARES_NATS_REPLICAS, value: "3" }
            - { name: ANTARES_ROLES, value: api }
          ports:
            - { containerPort: 9090 }
          readinessProbe:
            httpGet: { path: /q/ready, port: 9090 }
            periodSeconds: 1
          livenessProbe:
            httpGet: { path: /q/health, port: 9090 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { memory: 128Mi, cpu: 100m }
            limits: { memory: 350Mi } # the CI RSS gate's ceiling (R1/R2)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: antares-worker
  namespace: antares
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 1 }
  selector:
    matchLabels: { app: antares, role: worker }
  template:
    metadata:
      labels: { app: antares, role: worker }
    spec:
      # P0-1: the `antares*` Services make kubelet inject ANTARES_PORT/
      # ANTARES_SERVICE_* into every pod — fatal under the unknown-key
      # check. Belt at main.rs skips the injected shapes; this is braces.
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: { type: RuntimeDefault }
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: antares
          image: antares-local:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          env:
            - { name: ANTARES_STORE, value: postgres }
            # §16.1 PRODUCTION: use a non-superuser role + ANTARES_REQUIRE_RLS=1
            # (see the api Deployment above).
            - name: ANTARES_DATABASE_URL
              value: postgresql://antares:antares@antares-pg-rw.antares.svc:5432/antares
            # - { name: ANTARES_REQUIRE_RLS, value: "1" }   # enable in production
            - { name: ANTARES_BUS, value: nats }
            - { name: ANTARES_NATS_URL, value: "nats://nats.antares.svc:4222" }
            - { name: ANTARES_NATS_REPLICAS, value: "3" }
            - { name: ANTARES_ROLES, value: "matcher,notifier,temporal" }
          ports:
            - { containerPort: 9090 } # health only; no Service routes here
          readinessProbe:
            httpGet: { path: /q/ready, port: 9090 }
            periodSeconds: 2
          livenessProbe:
            httpGet: { path: /q/health, port: 9090 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { memory: 128Mi, cpu: 100m }
            limits: { memory: 350Mi }
